<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Flask App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Flask Blueprint App</h1>
        <nav>
            <a href="{{ url_for('users.greetings', name='Іванна') }}">👤 Користувачі</a> |
            <a href="{{ url_for('products.list_products') }}">🛒 Продукти</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>© 2025 Flask Lab 3 | Піварчук Іванна</p>
    </footer>
</body>
</html>
