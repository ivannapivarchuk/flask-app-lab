{% macro render_field(field) %}
<div class="form-group">
    {{ field.label }}<br>
    {{ field(size=32, class="form-input") }}
    {% if field.errors %}
        <ul class="errors">
        {% for error in field.errors %}
            <li>{{ error }}</li>
        {% endfor %}
        </ul>
    {% endif %}
</div>
{% endmacro %}
