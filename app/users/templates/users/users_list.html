{% extends "base.html" %}
{% block title %}Всі користувачі{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4 text-center" style="color: #ff66b2;">Список користувачів ({{ count }})</h2>
    <div class="list-group shadow-sm">
        {% for user in users %}
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <strong class="fs-5">{{ user.username }}</strong>
                <br>
                <small class="text-muted">{{ user.email }}</small>
            </div>
            <span class="badge rounded-pill bg-light text-dark border">ID: {{ user.id }}</span>
        </div>
        {% else %}
            <p>Користувачів немає.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
